
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffeaf2">
<title>For Arushi 💗</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
padding:22px 14px;
overflow:hidden;
color:#71324f;
font-family:Georgia,serif;
background:
radial-gradient(circle at 15% 15%,#ffd9e8,transparent 32%),
radial-gradient(circle at 85% 85%,#fbd5e5,transparent 30%),
linear-gradient(135deg,#fff8fb,#ffeaf2);
}

.hearts{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
}

.heart{
position:absolute;
bottom:-40px;
opacity:.5;
animation:floatUp linear infinite;
color:#e98aad;
}

@keyframes floatUp{
from{transform:translateY(0);opacity:0}
15%{opacity:.55}
to{transform:translateY(-115vh) rotate(25deg);opacity:0}
}

.card{
width:min(100%,570px);
min-height:390px;
position:relative;
z-index:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:clamp(25px,7vw,48px);
border:1px solid #f6cbdc;
border-radius:28px;
background:rgba(255,255,255,.9);
box-shadow:0 20px 60px rgba(139,53,91,.15);
backdrop-filter:blur(9px);
}

.top{
font:700 11px Arial;
letter-spacing:.2em;
text-transform:uppercase;
color:#d66b95;
}

h1{
font-size:clamp(29px,8vw,43px);
margin:14px 0 6px;
}

.flower{
font-size:25px;
margin:12px 0;
}

#message{
width:100%;
min-height:180px;
display:grid;
place-items:center;
font-size:clamp(20px,5.2vw,27px);
line-height:1.75;
white-space:pre-line;
animation:fade .45s ease;
}

#message.poem{
font-size:clamp(18px,4.7vw,23px);
line-height:1.9;
}

.english{
color:#e53955;
font-weight:bold;
}

.shayari-label{
color:#d99a00;
font-weight:bold;
}

.poem-text{
color:#71324f;
}

@keyframes fade{
from{opacity:0;transform:translateY(12px)}
to{opacity:1;transform:translateY(0)}
}

button{
margin-top:12px;
padding:14px 30px;
border:0;
border-radius:999px;
color:white;
background:linear-gradient(135deg,#ee83aa,#d94f86);
box-shadow:0 9px 22px rgba(217,79,134,.25);
font:700 15px Arial;
cursor:pointer;
}

.count{
margin-top:17px;
color:#a77a90;
font:12px Arial;
}

.track{
width:100%;
height:5px;
margin-top:9px;
background:#f9e2eb;
border-radius:8px;
overflow:hidden;
}

.fill{
height:100%;
width:0;
background:#e879a3;
transition:width .35s;
}

.overlay{
position:fixed;
inset:0;
z-index:3;
display:grid;
place-items:center;
padding:20px;
background:rgba(79,34,56,.42);
transition:opacity .35s;
}

.overlay.hide{
opacity:0;
pointer-events:none;
}

.popup{
width:min(100%,400px);
text-align:center;
padding:34px 24px;
border-radius:26px;
border:1px solid #f6cbdc;
background:#fff7fa;
box-shadow:0 20px 60px rgba(50,20,35,.2);
}

.popup .big{font-size:43px}

.popup h2{
margin:12px 0 5px;
font-size:clamp(27px,7vw,34px);
}

.popup p{
color:#987084;
font:14px/1.6 Arial;
}

@media(prefers-reduced-motion:reduce){
*,*::before,*::after{
animation-duration:.01ms!important;
transition-duration:.01ms!important;
}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<main class="card">

<div class="top">A little note for you</div>

<h1>For Arushi 💗</h1>

<div class="flower">🌷 ✨ 🌷</div>

<div id="message">
Tumhare liye kuch khaas...
</div>

<button id="next" type="button">
Next ❤️
</button>

<div class="count" id="count">1 / 6</div>

<div class="track">
<div class="fill" id="fill"></div>
</div>

</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">

<div class="popup">

<div class="big">💌</div>

<h2>massage for you cutie 🥰</h2>

<p>Ek chhota sa message, sirf tumhare liye 💖</p>

<button id="open" type="button">
Open Message 💗
</button>

</div>
</div>

<script>

const messages = [

"Hii Arushi 💗",

"I love you mera pyara baccha ❤️",

"I know ki aage chal ke bahut sare problem aayegi hamari life me, lekin betu ham dono mil ke us problem ko solve karenge 🫶❤️",

"Betu ye kabhi mat sochna ki ham chhod ke chal jayenge kabhi bhi.\nKabhi nahi jayenge ❤️\nTum mere liye special ho bahut 🥹💗",

"Bas betu jhuth mat bolna kabhi kyuki bahut trust hai tum par aur ha sona rona nahi 🥰\nBas etna hi bolna tha aur ha eske bad kuchh aur hai to next click kar lena 💌",

`<span class="english">In english we say:</span>

<br><br>

<span class="poem-text">I love your eyes</span>

<br><br>

<span class="shayari-label">But in shayari:</span>

<br><br>

<span class="poem-text">
Teri aankhein dekh main baate bhul gaya Rakha jo phool tha laana bhool gaya,

<br><br>

Tu kitni khubsurat hai ye kaise bayan karu Chhod yaar teri aankhein dekh main aage Line bhool gaya..!!
</span>`

];

let current=0;

const message=document.getElementById("message");
const next=document.getElementById("next");
const count=document.getElementById("count");
const fill=document.getElementById("fill");

function showMessage(){

message.classList.remove("poem");

if(current===messages.length-1){
message.innerHTML=messages[current];
message.classList.add("poem");
}else{
message.textContent=messages[current];
}

message.style.animation="none";
void message.offsetWidth;
message.style.animation="";

count.textContent=`${current+1} / ${messages.length}`;

fill.style.width=`${((current+1)/messages.length)*100}%`;

next.textContent=current===messages.length-1
?"फिर से पढ़ें ↺"
:"Next ❤️";

}

document.getElementById("open").addEventListener("click",()=>{

document.getElementById("overlay").classList.add("hide");

current=0;

showMessage();

next.focus();

});

next.addEventListener("click",()=>{

current=(current+1)%messages.length;

showMessage();

});

const hearts=document.getElementById("hearts");

if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){

for(let i=0;i<18;i++){

const h=document.createElement("span");

h.className="heart";

h.textContent=i%3===0?"💗":i%3===1?"♡":"♥";

h.style.left=`${Math.random()*100}%`;

h.style.animationDuration=`${8+Math.random()*10}s`;

h.style.animationDelay=`${Math.random()*-16}s`;

h.style.fontSize=`${13+Math.random()*18}px`;

hearts.appendChild(h);

}

}

</script>

</body>
</html>
